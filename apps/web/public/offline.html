<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101b2d" />
    <title>Sem conexão | Fabricante de Milhas</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101b2d; color: #f8fafc; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      main { width: min(100%, 420px); }
      img { width: 112px; height: 112px; object-fit: contain; margin-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #cbd5e1; }
      button { border: 0; border-radius: 10px; padding: 12px 18px; background: #c6a45c; color: #101b2d; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.jpeg" alt="Fabricante de Milhas" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar seus dados e atualizar suas informações.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
