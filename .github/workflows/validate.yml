name: Validate full-stack application

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabricante_milhas?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Type-check frontend and backend
        run: npm run typecheck
      - name: Build frontend and backend
        run: npm run build
      - name: Run architecture smoke checks
        run: python3 tests/stack-smoke-check.py
